spring.application.name=simple-store
spring.threads.virtual.enabled=true

server.http2.enabled=true
server.shutdown=graceful
server.port=8080

opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=http
opensearch.username=admin
opensearch.password=SuperSecretPassword123!

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.datasource.url=jdbc:postgresql://localhost:5432/simplestore
spring.datasource.username=simplestore
spring.datasource.password=simplestore

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=simplestore
spring.rabbitmq.password=simplestore
# Outbox relay only marks a message sent once the broker confirms it
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Retry failed deliveries in the listener, then dead-letter them rather than requeueing forever
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2

outbox.relay.fixed-delay-ms=500
