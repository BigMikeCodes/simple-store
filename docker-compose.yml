volumes:
  opensearch-data:
  postgres-data:

services:

  opensearch:
    image: opensearchproject/opensearch:latest
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=SuperSecretPassword123!"
      - "DISABLE_SECURITY_PLUGIN=true"

    ports:
      - "9200:9200"
      - "9600:9600"

  valkey:
    image: valkey/valkey:9.0.3
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      - RABBITMQ_DEFAULT_USER=simplestore
      - RABBITMQ_DEFAULT_PASS=simplestore
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.0
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=simplestore
      - POSTGRES_USER=simplestore
      - POSTGRES_PASSWORD=simplestore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplestore -d simplestore"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Applies ./migrations on `docker compose up`; rerun with `docker compose run --rm flyway migrate`
  flyway:
    image: flyway/flyway:11.14
    command: migrate
    volumes:
      - ./migrations:/flyway/migrations:ro
    environment:
      - FLYWAY_LOCATIONS=filesystem:/flyway/migrations
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/simplestore
      - FLYWAY_USER=simplestore
      - FLYWAY_PASSWORD=simplestore
    depends_on:
      postgres:
        condition: service_healthy
